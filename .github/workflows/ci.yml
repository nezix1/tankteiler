name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tankteiler
          POSTGRES_USER: tankteiler
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tankteiler -d tankteiler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run repository hooks
        run: pre-commit run --all-files
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
      - name: Apply and verify PostgreSQL migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://tankteiler:ci-only@localhost:5432/tankteiler
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only
        run: docker compose config --quiet
      - name: Build backend image
        env:
          POSTGRES_PASSWORD: ci-only
        run: docker compose build api
